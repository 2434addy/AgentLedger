version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: agentledger
      POSTGRES_PASSWORD: agentledger
      POSTGRES_DB: agentledger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agentledger -d agentledger']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agentledger:agentledger@postgres:5432/agentledger
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-me
      JWT_EXPIRES_IN: 15m
      NODE_ENV: development
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ./backend/src:/app/src

volumes:
  postgres_data:
